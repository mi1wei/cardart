name: Desktop checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            arch: x64
            build: --win nsis --x64
            app: release/win-unpacked
            artifact: windows-x64-setup.exe
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            build: --mac dmg --x64
            app: release/mac/Folio.app
            artifact: macos-x64.dmg
          - runner: macos-15
            platform: darwin
            arch: arm64
            build: --mac dmg --arm64
            app: release/mac-arm64/Folio.app
            artifact: macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      TARGET_BUILD: ${{ matrix.build }}
      APP_DIR: ${{ matrix.app }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Assert native host
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci --include=optional
      - name: Prepare Electron outside timed desktop tests
        run: npx --no-install electron --version
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build without publishing
        run: |
          if [[ "$EXPECTED_PLATFORM" == "darwin" ]]; then
            # Ad-hoc only: no signing credentials exist in this job.
            export CSC_FOR_PULL_REQUEST=true
          fi
          npm run package:desktop -- $TARGET_BUILD
      - name: Verify the actual unsigned or ad-hoc candidate
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/verify-release.mjs --app "$APP_DIR" --artifact "release/Folio-$VERSION-$ARTIFACT_SUFFIX"
      # No binary uploads from pull requests or unapproved technical checks.

name: Desktop candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to build; never creates or rewrites a tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/create-release-manifest.mjs identity --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  native:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            arch: x64
            build: --win nsis --x64
            app: release/win-unpacked
            artifact: windows-x64-setup.exe
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            build: --mac dmg --x64
            app: release/mac/Folio.app
            artifact: macos-x64.dmg
          - runner: macos-15
            platform: darwin
            arch: arm64
            build: --mac dmg --arm64
            app: release/mac-arm64/Folio.app
            artifact: macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      TARGET_BUILD: ${{ matrix.build }}
      APP_DIR: ${{ matrix.app }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Assert native host
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci --include=optional
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build without publishing or signing credentials
        run: npm run package:desktop -- $TARGET_BUILD
      - name: Verify files, native execution and distribution approval before any upload
        run: |
          node scripts/verify-release.mjs \
            --app "$APP_DIR" \
            --artifact "release/Folio-$RELEASE_VERSION-$ARTIFACT_SUFFIX" \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --require-distribution-approval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folio-candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/candidate-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  draft:
    needs: [identity, native]
    if: github.repository == 'mi1wei/cardart'
    runs-on: ubuntu-latest
    environment: desktop-candidates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: folio-candidate-*
          path: release-candidates
          merge-multiple: false
      - name: Assemble only the verified whitelist
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
        run: node scripts/create-release-manifest.mjs --input release-candidates --output release-public --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Create or resume an immutable draft, never publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-desktop-release.mjs --directory release-public
